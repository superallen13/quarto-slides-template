<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Section divider wave">
  <!-- Neutral section-divider wave (also the cover's footer). Asymmetric: the crest rides
       high on the left and eases down to the right. Recolour the fills/gradient for your
       brand, or replace this file. background-size="cover" fits this 16:9 art onto the
       16:9 page exactly (see the divider GOTCHA in theme/_base.scss). -->
  <defs>
    <linearGradient id="dividerWave" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#3D6E9C"/>
      <stop offset="1" stop-color="#2B527A"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- light under-wave, higher on the left -->
  <path d="M0 540 C 220 500 420 560 640 588 C 880 618 1100 600 1280 626 L1280 720 L0 720 Z" fill="#DDE9F5"/>
  <!-- main gradient wave -->
  <path d="M0 600 C 240 556 470 612 700 634 C 930 656 1120 648 1280 668 L1280 720 L0 720 Z" fill="url(#dividerWave)"/>
</svg>
